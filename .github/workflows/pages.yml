# Publica a galeria (index.html e as animações) no GitHub Pages a cada push em main.
# Os vídeos rodam no navegador a partir do código; nada é compilado nem renderizado aqui.
name: Galeria no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r ferramentas aula* _site/
          find _site -name '*.py' -delete
          find _site -type d \( -name export -o -name __pycache__ \) -prune -exec rm -rf {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
